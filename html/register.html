<!DOCTYPE html>
<html lang="ru" class="preload">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — BitWave</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/particles.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <div class="canvas-container">
        <canvas id="particles-canvas"></canvas>
    </div>
    <div id="navbar"></div>
    <main class="auth-container fade-in-page">
        <div class="auth-centered-wrapper">
            <div class="auth-brand-logo">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="currentColor">
                    <rect x="14" y="10" width="33" height="8" />
                    <rect x="14" y="18" width="8" height="17" />
                    <rect x="39" y="18" width="8" height="8" />
                    <rect x="14" y="45" width="33" height="8" />
                </svg>
            </div>
            <h1 class="auth-main-title">Создать аккаунт</h1>
            <div class="auth-oauth-row">
                <button class="btn-oauth-tile fade-in-left delay-100" onclick="registerWithGoogle()"
                    title="Через Google">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z" />
                    </svg>
                </button>
                <button class="btn-oauth-tile fade-in-left delay-200" onclick="registerWithGithub()"
                    title="Через GitHub">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.699-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.379.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
                    </svg>
                </button>
                <button class="btn-oauth-tile fade-in-left delay-300" onclick="registerWithTelegram()"
                    title="Через Telegram">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M21.944 4.662c-.307-.259-.756-.332-1.135-.184L2.832 11.44c-.61.244-.593 1.115.027 1.334l4.584 1.53 1.78 5.34c.18.54.86.71 1.272.319l2.56-2.42 4.72 3.47c.51.374 1.24.1 1.37-.51l2.85-14.34c.09-.44-.06-.9-.39-1.18zM9.88 18.18l-1.2-3.6 8.64-5.44-7.44 6.98z" />
                    </svg>
                </button>
            </div>
            <div class="auth-minimal-divider fade-in-page delay-200">или</div>
            <form class="auth-minimal-form" onsubmit="handleRegister(event)">
                <div class="input-wrapper-modern fade-in-up delay-100">
                    <input class="input-modern" type="email" id="reg-email" placeholder="Электронная почта" required>
                </div>
                <div class="input-wrapper-modern fade-in-up delay-200">
                    <input class="input-modern" type="password" id="reg-password"
                        placeholder="Пароль (минимум 8 символов)" required>
                </div>
                <div class="input-wrapper-modern fade-in-up delay-300">
                    <input class="input-modern" type="password" id="reg-password-confirm" placeholder="Повторите пароль"
                        required>
                </div>
                <button class="btn-raycast-primary fade-in-up delay-400" type="submit">Создать аккаунт</button>
                <div class="auth-legal-notice fade-in-up delay-400">
                    <label class="legal-checkbox-label">
                        <input type="checkbox" id="terms" required>
                        <span class="custom-checkmark"></span>
                        <span class="legal-text">Я согласен с <a href="resources.html#sec-agreement"
                                class="link">условиями обслуживания</a></span>
                    </label>
                </div>
            </form>
            <div class="auth-minimal-footer fade-in-up delay-500">
                <a href="login.html" class="btn-secondary-outline">Уже зарегистрированы? Войти</a>
            </div>
        </div>
    </main>
    <script src="../js/navigation.js"></script>
    <script src="../js/particles.js"></script>
    <script src="../js/client.js"></script>
</body>

</html>
